<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick’em 2026 — Garrott vs Kyle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDF1; --surface:#FFFFFF; --ink:#13202E; --muted:#5A6A7A; --line:#D2DBE3; --soft:#F2F5F8;
  --g:#1E4FD8; --k:#E0801A; --win:#1F8A4C; --loss:#C2413A;
  --turf:#1B5A3A; --turf2:#1F6642;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A24; --surface:#152535; --ink:#E9EFF5; --muted:#93A5B6; --line:#24384C; --soft:#1B2E41;
    --g:#5B86FF; --k:#F49A3A; --win:#3CB46E; --loss:#E2615A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A24; --surface:#152535; --ink:#E9EFF5; --muted:#93A5B6; --line:#24384C; --soft:#1B2E41;
  --g:#5B86FF; --k:#F49A3A; --win:#3CB46E; --loss:#E2615A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.cond{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif}
.wrap{max-width:720px;margin:0 auto}

/* Turf scoreboard */
.hero{background:
  repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(255,255,255,.16) calc(10% - 2px) 10%),
  repeating-linear-gradient(90deg,var(--turf) 0 10%,var(--turf2) 10% 20%);
  color:#fff;padding:18px 16px 20px}
.hero h1{margin:0 0 14px;font:700 20px/1 "Barlow Condensed",sans-serif;letter-spacing:.02em;opacity:.9}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;max-width:520px;margin:0 auto}
.side{display:flex;flex-direction:column;align-items:center}
.side .who{font:700 18px/1 "Barlow Condensed",sans-serif;display:flex;align-items:center;gap:6px}
.side .who i{width:10px;height:10px;border-radius:50%;display:inline-block}
.side .num{font:800 72px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.side .sub{font-size:13px;opacity:.85}
.vs{font:700 15px/1 "Barlow Condensed",sans-serif;opacity:.7;padding-bottom:30px}
.lead{text-align:center;margin-top:10px;font-size:14px;opacity:.92}

/* Sticky week bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.weeks{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;min-width:46px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.wk b{font:700 19px/1 "Barlow Condensed",sans-serif}
.wk small{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:600}
.wk[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wk[aria-current="true"] small{color:var(--bg);opacity:.75}
.cols{display:grid;grid-template-columns:1fr 50px 50px 50px;align-items:center;padding:6px 14px 8px;gap:6px}
.cols .wkt{font:700 22px/1.1 "Barlow Condensed",sans-serif}
.cols .wkt span{display:block;font:500 13px/1.3 Barlow,sans-serif;color:var(--muted)}
.cols .h{text-align:center;font:700 15px/1 "Barlow Condensed",sans-serif}
.cols .h.g{color:var(--g)} .cols .h.k{color:var(--k)}
.cols .h em{display:block;font:600 12px/1.3 Barlow,sans-serif;font-style:normal;color:var(--muted);margin-top:2px}

main{padding:4px 10px 40px}
.day{font:700 15px/1 "Barlow Condensed",sans-serif;color:var(--muted);margin:18px 6px 8px;letter-spacing:.02em}
.game{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.meta{display:flex;justify-content:space-between;gap:8px;padding:8px 14px 0;font-size:12.5px;color:var(--muted);font-weight:600}
.meta .st{font-weight:700}
.meta .st.live{color:var(--loss)} .meta .st.fin{color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 50px 50px 50px;align-items:center;gap:6px;padding:6px 14px}
.team{display:flex;align-items:center;gap:10px;min-width:0}
.bdg{width:38px;height:44px;flex:0 0 auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.tn{min-width:0;flex:1}
.tn .nm{font:700 19px/1.05 "Barlow Condensed",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .ct{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{font:800 24px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.row.lost .nm,.row.lost .sc{opacity:.45}
.row.won .sc::after{content:"";display:inline-block;border:5px solid transparent;border-right-color:var(--ink);margin-left:3px;vertical-align:middle}
.ck{width:44px;height:44px;margin:0 auto;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;transition:transform .12s,background-color .12s}
.ck svg{width:22px;height:22px;opacity:0}
.ck.on svg{opacity:1}
.ck.g.on{background:var(--g);border-color:var(--g);color:#fff}
.ck.k.on{background:var(--k);border-color:var(--k);color:#fff}
:root{--t:#7A3FC4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--t:#B08AF5}}
:root[data-theme="dark"]{--t:#B08AF5}
.ck.t.on{background:var(--t);border-color:var(--t);color:#fff}
.cols .h.t{color:var(--t);font-size:13px}
.ck.on.right{background:var(--win);border-color:var(--win)}
.ck.on.wrong{background:var(--loss);border-color:var(--loss)}
.ck.locked:not(.on){opacity:.35}
.ck:active{transform:scale(.9)}
.ck.nudge{animation:nudge .3s}
@keyframes nudge{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.manual{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 14px 10px;font-size:13px;color:var(--muted)}
.manual button{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;color:var(--ink)}
.manual button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gap{height:4px}
.byes{margin:16px 6px;font-size:13.5px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:24px 6px 0;font-size:13px;color:var(--muted)}
.tog{display:flex;align-items:center;gap:8px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--g)}
.sync{display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--win)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:400px){
  .row,.cols{grid-template-columns:1fr 42px 42px 42px;gap:4px}
  .ck{width:38px;height:38px}
  .bdg{width:32px;height:38px}
  .cols .h,.cols .h.t{font-size:12.5px}
  .cols .h em{font-size:11px}
  .tn .nm{font-size:17px}
  .side .num{font-size:60px}
}
.team{cursor:pointer;border-radius:10px}
.team:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.sheet{position:fixed;inset:0;z-index:30}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(8,14,20,.55)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;max-height:86%;background:var(--surface);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.ph{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.ph .bdg{width:48px;height:56px}
.ph h2{margin:0;font:800 26px/1 "Barlow Condensed",sans-serif}
.ph p{margin:4px 0 0;color:var(--muted);font-size:14px}
.x{margin-left:auto;flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--soft);font-size:16px}
.pl{overflow-y:auto;padding:4px 10px 18px;overscroll-behavior:contain}
.sec{font:700 15px/1 "Barlow Condensed",sans-serif;color:var(--muted);margin:16px 6px 4px}
.gl{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.gl:last-child{border-bottom:0}
.gl .wkn{font:700 13px/1.2 Barlow,sans-serif;color:var(--muted)}
.opw{display:flex;align-items:center;gap:10px;min-width:0}
.opw .bdg{width:30px;height:35px}
.op{font:700 17px/1.1 "Barlow Condensed",sans-serif;min-width:0}
.op span{display:block;font:500 12.5px/1.3 Barlow,sans-serif;color:var(--muted)}
.res{font:800 18px/1 "Barlow Condensed",sans-serif;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.res.w{color:var(--win)} .res.l{color:var(--loss)} .res.up{font:600 13px/1.3 Barlow,sans-serif;color:var(--muted)}
.byeln{margin:12px 6px 0;font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  const off = g.date >= "2026-11-01" && g.date < "2027-03-14" ? "-05:00" : "-04:00";

function winner(g){

}

function lum(hex){
  const n = parseInt(hex.slice(1),16), r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;

// ---------- records & scoring ----------
function records(){
  const r = {}; Object.keys(T).forEach(k => r[k] = [0,0,0]);
  GAMES.forEach(g => { const w = winner(g); if (!w) return;
    if (w === "TIE"){ r[g.away][2]++; r[g.home][2]++; }
    else { r[w][0]++; r[w === g.home ? g.away : g.home][1]++; } });
  return r;
}
function weekScore(wk){
  const gs = GAMES.filter(g => g.wk === wk), out = {};
  P.forEach(p => {
    let right = 0, made = 0;
    gs.forEach(g => { const pk = picks[p.id][g.id]; if (pk) made++; const w = winner(g); if (pk && w && pk === w) right++; });
    out[p.id] = {right, made};
  });
  out.total = gs.length; out.done = gs.every(g => winner(g));
  return out;
}

// ---------- persistence ----------
function loadLocal(){
  try { const s = JSON.parse(localStorage.getItem(LS) || "null");
    if (s){ picks = Object.assign({garrott:{}, kyle:{}, together:{}}, s.picks || {}); manual = s.manual || {}; } } catch(e){}
}
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify({picks, manual})); } catch(e){} }
const timers = {}, inflight = {}, again = {};
function payload(path){ return path === "results/manual" ? {winners: manual} : {picks: picks[path.split("/")[1]]}; }
function persist(path){
  saveLocal();
  if (!db || !canWrite) return;
  clearTimeout(timers[path]);
  timers[path] = setTimeout(() => { delete timers[path]; flush(path); }, 350);
}
async function flush(path){
  if (inflight[path]){ again[path] = true; return; }
  inflight[path] = true;
  try { await db.doc(path).set(payload(path)); }
  catch(e){
    if (e && e.code === "invalid_argument"){ canWrite = false; setSync(); toast("Saved on this device only — ask Garrott to invite you as an editor to sync."); }
  }
  inflight[path] = false;
  if (again[path]){ again[path] = false; flush(path); }
}
function setSync(){
  const s = document.getElementById("sync"); if (!s) return;
  const on = db && canWrite;
  s.className = "sync" + (on ? " ok" : "");
  s.lastChild.textContent = on ? "Synced for Garrott and Kyle" : db ? "Read-only, saved on this device" : "Saved on this device";
}
async function connect(){
  if (!window.claude || !window.claude.use) return;
  try { db = await window.claude.use("db"); } catch(e){ db = null; }
  if (!db) return;
  try { const user = await window.claude.use("user"); const c = user ? await user.can("data.write") : null; if (c === false) canWrite = false; } catch(e){}
  setSync();
  P.forEach(p => {
    const path = "picks/" + p.id;
    db.doc(path).onSnapshot(snap => {
      if (timers[path] || inflight[path]) return;
      picks[p.id] = (snap.exists && snap.data().picks) ? {...snap.data().picks} : picks[p.id];
      saveLocal(); render();
    }, () => {});
  });
  db.doc("results/manual").onSnapshot(snap => {
    if (timers["results/manual"] || inflight["results/manual"]) return;
    if (snap.exists && snap.data().winners) manual = {...snap.data().winners};
    saveLocal(); render();
  }, () => {});
}

// ---------- render ----------
function renderHero(){
  let tot = {garrott:0, kyle:0, together:0}, wins = {garrott:0, kyle:0}, ties = 0;
  WEEKS.forEach(wk => { const s = weekScore(wk); P.forEach(p => tot[p.id] += s[p.id].right);
    if (s.done && (s.garrott.made || s.kyle.made)){
      if (s.garrott.right > s.kyle.right) wins.garrott++; else if (s.kyle.right > s.garrott.right) wins.kyle++; else ties++; } });
  document.getElementById("sG").textContent = tot.garrott;
  document.getElementById("sK").textContent = tot.kyle;
  const wl = n => n === 1 ? "1 week won" : n + " weeks won";
  document.getElementById("wG").textContent = wl(wins.garrott);
  document.getElementById("wK").textContent = wl(wins.kyle);
  const d = tot.garrott - tot.kyle;
  document.getElementById("lead").textContent = d === 0 ? (tot.garrott ? "Dead even on correct picks" : "Correct picks this season") : (d > 0 ? "Garrott" : "Kyle") + " leads by " + Math.abs(d) + (Math.abs(d) === 1 ? " pick" : " picks");
  document.getElementById("lead").textContent += ". Together picks: " + tot.together + " right";
}
function renderWeeks(){
  const nav = document.getElementById("weeks");
  nav.innerHTML = WEEKS.map(wk => {
    const s = weekScore(wk); let tag = "";
    if (s.done && (s.garrott.made || s.kyle.made)) tag = s.garrott.right > s.kyle.right ? "G" : s.kyle.right > s.garrott.right ? "K" : "Tie";
    else if (wk === currentWeek()) tag = "Now";
    return `<button class="wk" data-wk="${wk}" aria-current="${wk === week}"><b>${wk}</b><small>${tag || "&nbsp;"}</small></button>`;
  }).join("");
}

      P.forEach(p => {
        const on = picks[p.id][g.id] === ab;
        let res = ""; if (on && w) res = w === ab ? " right" : " wrong";
        html += `<button class="ck ${p.c}${on ? " on" : ""}${res}${locked ? " locked" : ""}" data-g="${g.id}" data-t="${ab}" data-p="${p.id}" aria-pressed="${on}" aria-label="${p.name} picks ${t[1]}">${on && res === " wrong" ? XMARK : CHECK}</button>`;

function currentWeek(){
  const now = Date.now();
  for (const wk of WEEKS){ const gs = GAMES.filter(g => g.wk === wk); if (gs[gs.length-1].ko.getTime() + 5*3600e3 > now) return wk; }
  return WEEKS[WEEKS.length-1];
}
function setWeek(wk, scroll){
  week = wk; try { history.replaceState(null, "", "#week" + wk); } catch(e){}
  render(); window.scrollTo({top:0});
  const b = document.querySelector(`.wk[data-wk="${wk}"]`); if (b && scroll !== false) b.scrollIntoView({inline:"center", block:"nearest"});
}

// ---------- team games sheet ----------
function openTeam(ab){
  const t = T[ab], r = records()[ab];
  const gs = GAMES.filter(g => g.away === ab || g.home === ab);
  document.getElementById("shHead").innerHTML = `${badge(ab)}<div><h2 id="shT">${t[0]} ${t[1]}</h2><p>${r[0]}-${r[1]}${r[2] ? "-" + r[2] : ""} in ${t[4]}</p></div>`;
  const row = g => {
    const home = g.home === ab, opp = home ? g.away : g.home, w = winner(g);
    const where = g.neutral ? "vs" : home ? "vs" : "at";
    const when = g.ko.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"}) + (g.neutral ? ", neutral site" : "");
    let res, cls;
    if (w){
      const tag = w === "TIE" ? "T" : w === ab ? "W" : "L";
      cls = tag === "W" ? "w" : tag === "L" ? "l" : "";
      const us = home ? g.hs : g.as, them = home ? g.as : g.hs;
      res = us != null ? `${tag} ${us}-${them}` : tag;
    } else { cls = "up"; res = started(g) ? "Underway" : fmtTime(g.ko); }
    return `<button class="gl" data-gowk="${g.wk}" aria-label="Go to week ${g.wk}"><span class="wkn">Wk ${g.wk}</span><span class="opw">${badge(opp)}<span class="op">${where} ${T[opp][1]}<span>${when}</span></span></span><span class="res ${cls}">${res}</span></button>`;
  };
  const played = gs.filter(g => winner(g)).reverse(), up = gs.filter(g => !winner(g));
  const bye = WEEKS.find(wk => !gs.some(g => g.wk === wk));
  let html = "";
  if (played.length) html += `<div class="sec">Previous games</div>` + played.map(row).join("");
  if (up.length) html += `<div class="sec">Upcoming</div>` + up.map(row).join("");
  if (bye) html += `<p class="byeln">Bye in week ${bye}</p>`;
  document.getElementById("shList").innerHTML = html;
  document.getElementById("shList").scrollTop = 0;
  document.getElementById("sheet").hidden = false;
  document.body.style.overflow = "hidden";
  openTeam.from = document.activeElement;
  document.getElementById("shX").focus();
}
function closeTeam(){
  document.getElementById("sheet").hidden = true;
  document.body.style.overflow = "";
  if (openTeam.from && openTeam.from.focus) openTeam.from.focus();
}

// ---------- events ----------
document.addEventListener("click", e => {
  if (e.target.closest("[data-close]")){ closeTeam(); return; }
  const go = e.target.closest("[data-gowk]");
  if (go){ closeTeam(); setWeek(+go.dataset.gowk); return; }
  const tm = e.target.closest("[data-team]");
  if (tm){ openTeam(tm.dataset.team); return; }
  const wkBtn = e.target.closest(".wk");
  if (wkBtn){ setWeek(+wkBtn.dataset.wk); return; }
  const ck = e.target.closest(".ck");
  if (ck){
    const g = GAMES.find(x => x.id === ck.dataset.g), p = ck.dataset.p, t = ck.dataset.t;
    if (started(g) && !unlock){ ck.classList.remove("nudge"); void ck.offsetWidth; ck.classList.add("nudge"); toast("That game has kicked off, so picks are locked"); return; }
    if (picks[p][g.id] === t) delete picks[p][g.id]; else picks[p][g.id] = t;
    persist("picks/" + p); render(); return;
  }
  const mw = e.target.closest("[data-win]");
  if (mw){
    const id = mw.dataset.g, v = mw.dataset.win;
    if (manual[id] === v) delete manual[id]; else manual[id] = v;
    persist("results/manual"); render(); return;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.getElementById("sheet").hidden){ closeTeam(); return; }
  const tm = e.target.closest && e.target.closest("[data-team]");
  if (tm && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); openTeam(tm.dataset.team); }
});
document.addEventListener("change", e => { if (e.target.id === "unlock"){ unlock = e.target.checked; renderWeek(); } });

// ---------- start ----------
loadLocal();
const h = (location.hash || "").match(/^#week(\d+)$/);
week = h && WEEKS.includes(+h[1]) ? +h[1] : currentWeek();
render();
requestAnimationFrame(() => { const b = document.querySelector(`.wk[data-wk="${week}"]`); if (b) b.scrollIntoView({inline:"center", block:"nearest"}); });
connect();
setInterval(() => renderWeek(), 60000);
</script>
</body>
</html>
